name: ✅ Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web (typecheck, unit, build, routes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.2.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:routes

  rest-api:
    name: REST API (build + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run build -w shared-models
      - run: npm run build -w rest-api
      - run: npm test -w rest-api

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm ci --prefix rules-tests || npm install --prefix rules-tests
      - run: firebase emulators:exec --only firestore --project demo-innkie "npm --prefix rules-tests test"
