name: ✅ Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web (typecheck, unit, build, routes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.2.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:routes

  rest-api:
    name: REST API (build + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run build -w shared-models
      - run: npm run build -w rest-api
      - run: npm test -w rest-api

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm ci --prefix rules-tests || npm install --prefix rules-tests
      - run: firebase emulators:exec --only firestore --project demo-innkie "npm --prefix rules-tests test"

  docker-image:
    name: REST API image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t innkie-backend-test -f rest-api/Dockerfile .
      - name: Start the container and wait for the health endpoint
        run: |
          docker run -d --name api -p 8080:8080 -e PORT=8080 innkie-backend-test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
