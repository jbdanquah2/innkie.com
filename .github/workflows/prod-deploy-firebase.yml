name: 🔥 Deploy Firebase

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    name: Deploy Firebase
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js (use Node 22 for Firebase 2nd-gen)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      # 3️⃣ Install dependencies (Project-wide)
      - name: Install dependencies
        run: |
          set -e
          echo "🔹 Installing npm dependencies for all workspaces..."
          npm ci --legacy-peer-deps
          echo "✅ Dependencies installed."

      # 4️⃣ Install Firebase CLI globally
      - name: Install Firebase CLI
        run: |
          set -e
          echo "🔹 Installing Firebase CLI..."
          npm install -g firebase-tools
          echo "✅ Firebase CLI installed."

      # 5️⃣ Deploy Firebase Resources
      - name: Build and Deploy Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.CLOUD_RUN }}
        run: |
          set -e
          echo "🔹 Deploying Firebase resources..."
          firebase deploy --only functions,firestore:rules,firestore:indexes
          echo "✅ Firebase deployment completed."
