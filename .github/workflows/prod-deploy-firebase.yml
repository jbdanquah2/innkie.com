name: 🔥 Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      only:
        description: "What to deploy (firebase --only value). Use firestore:rules to test the credentials safely."
        default: "functions,firestore:rules,firestore:indexes"
        type: string
  workflow_call:

jobs:
  deploy:
    name: Deploy Firebase
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js (use Node 22 for Firebase 2nd-gen)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      # 3️⃣ Install dependencies (Project-wide)
      - name: Install dependencies
        run: |
          set -e
          echo "🔹 Installing npm dependencies for all workspaces..."
          npm ci --legacy-peer-deps
          echo "✅ Dependencies installed."

      # 4️⃣ Install Firebase CLI globally
      - name: Install Firebase CLI
        run: |
          set -e
          echo "🔹 Installing Firebase CLI..."
          npm install -g firebase-tools
          echo "✅ Firebase CLI installed."

      # 7️⃣ Deploy Firebase Resources
      # The firebase CLI cannot use a service-account JSON as FIREBASE_TOKEN (that is what made every run fail with
      # "An unexpected error has occurred"). It reads the JSON from a file named by GOOGLE_APPLICATION_CREDENTIALS.
      - name: Build and Deploy Firebase
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.CLOUD_RUN }}
          ONLY: ${{ inputs.only || 'functions,firestore:rules,firestore:indexes' }}
        run: |
          set -e
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          echo "🔹 Deploying Firebase resources: $ONLY"
          firebase deploy --only "$ONLY" --project default --non-interactive
          echo "✅ Firebase deployment completed."
