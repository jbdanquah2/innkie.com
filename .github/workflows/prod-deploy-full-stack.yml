name: 🏗️ Full Stack Deploy

on:
  workflow_dispatch:

# Required for calling reusable workflows that need OIDC (Workload Identity Federation)
permissions:
  contents: read
  id-token: write

jobs:
#  deploy-firebase:
#    name: Firebase (Functions/Rules)
#    uses: ./.github/workflows/prod-deploy-firebase.yml
#    secrets: inherit

  deploy-rest-api:
    name: REST API (Cloud Run)
    uses: ./.github/workflows/prod-deploy-rest-api.yml
    secrets: inherit

  deploy-frontend:
    name: Frontend (Hosting)
    needs: [deploy-rest-api] # Ensure backend/rules are updated before frontend
    uses: ./.github/workflows/prod-deploy-frontend.yml
    secrets: inherit
