<nav class="bg-white/80 backdrop-blur-md shadow-[0_1px_10px_-5px_rgba(0,0,0,0.05)] sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <!-- Left: Logo -->
      <div class="flex items-center">
        <app-logo class="flex-shrink-0"></app-logo>
      </div>

      <!-- Center: Desktop Navigation -->
      <div class="hidden md:flex flex-1 justify-center">
        <div class="flex space-x-8">
          <a routerLink="/" routerLinkActive="text-primary-600 border-primary-600" [routerLinkActiveOptions]="{ exact: true }"
             class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-bold text-slate-500 hover:text-slate-900 hover:border-slate-300 transition-all">
            Home
          </a>
          <a routerLink="/features" routerLinkActive="text-primary-600 border-primary-600"
             class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-bold text-slate-500 hover:text-slate-900 hover:border-slate-300 transition-all">
            Features
          </a>
          <a routerLink="/tools" routerLinkActive="text-primary-600 border-primary-600"
             class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-bold text-slate-500 hover:text-slate-900 hover:border-slate-300 transition-all">
            Tools
          </a>
          <a *ngIf="isLoggedIn" routerLink="/dashboard"
             class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-bold text-primary-600 transition-all">
            Go to Dashboard
          </a>
        </div>
      </div>

      <!-- Right: Actions & Mobile Toggle -->
      <div class="flex items-center space-x-4">
        <!-- Desktop Actions -->
        <div class="hidden md:flex md:items-center md:space-x-4" *ngIf="(userReady$ | async) && isBrowser">
          <ng-container *ngIf="!isLoggedIn">
            <a [routerLink]="['/login']" [queryParams]="{ signUp: false }"
               class="text-sm font-bold text-slate-600 hover:bg-slate-50 px-4 py-2 rounded-full transition-all border border-transparent hover:border-slate-100">
              Log in
            </a>
            <a [routerLink]="['/login']" [queryParams]="{ signUp: true }"
               class="inline-flex items-center px-6 py-2 border border-transparent text-sm font-bold rounded-full shadow-sm text-white bg-primary-600 hover:bg-primary-700 transition-all active:scale-95">
              Sign up
            </a>
          </ng-container>

          <div *ngIf="isLoggedIn" class="relative ml-3 profile-dropdown">
            <div>
              <button (click)="toggleProfileDropdown()" type="button" class="flex rounded-full bg-white text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-all hover:ring-2 hover:ring-slate-100" id="user-menu-button">
                <span class="sr-only">Open user menu</span>
                <img class="h-8 w-8 rounded-full border border-slate-200" [src]="userProfilePicUrl" alt="Profile">
              </button>
            </div>

            <!-- Dropdown menu -->
            <div *ngIf="isProfileDropdownOpen"
                 class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-2xl bg-white py-2 shadow-2xl ring-1 ring-black ring-opacity-5 focus:outline-none border border-slate-100 overflow-hidden"
                 role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button">
              <div class="px-4 py-2 border-b border-slate-50 mb-1">
                 <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">My Account</p>
              </div>
              <a routerLink="/dashboard" class="flex items-center gap-2 px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-all" role="menuitem" (click)="isProfileDropdownOpen = false">
                <i class="fas fa-th-large text-xs opacity-50"></i> Dashboard
              </a>
              <a (click)="logout()" class="flex items-center gap-2 px-4 py-2.5 text-sm font-bold text-red-600 hover:bg-red-50 transition-all cursor-pointer border-t border-slate-50 mt-1" role="menuitem">
                <i class="fas fa-sign-out-alt text-xs opacity-50"></i> Logout
              </a>
            </div>
          </div>
        </div>

        <!-- Mobile menu button -->
        <div class="flex items-center md:hidden">
          <button (click)="toggleMenu()" type="button" class="inline-flex items-center justify-center p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all border border-slate-100" aria-controls="mobile-menu">
            <span class="sr-only">Open main menu</span>
            <i [class]="isMenuOpen ? 'fas fa-times text-xl' : 'fas fa-bars text-xl'"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-white border-t border-slate-50 shadow-xl" id="mobile-menu">
    <div class="pt-4 pb-6 space-y-2 px-4">
      <div class="px-3 py-2 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Navigation</div>
      <a routerLink="/" (click)="isMenuOpen = false" routerLinkActive="bg-primary-50 text-primary-600 border-primary-600" [routerLinkActiveOptions]="{ exact: true }"
         class="block pl-3 pr-4 py-3 border-l-4 border-transparent text-base font-bold text-slate-600 hover:bg-slate-50 transition-all rounded-r-xl">
        Home
      </a>
      <a routerLink="/features" (click)="isMenuOpen = false" routerLinkActive="bg-primary-50 text-primary-600 border-primary-600"
         class="block pl-3 pr-4 py-3 border-l-4 border-transparent text-base font-bold text-slate-600 hover:bg-slate-50 transition-all rounded-r-xl">
        Features
      </a>
      <a routerLink="/tools" (click)="isMenuOpen = false" routerLinkActive="bg-primary-50 text-primary-600 border-primary-600"
         class="block pl-3 pr-4 py-3 border-l-4 border-transparent text-base font-bold text-slate-600 hover:bg-slate-50 transition-all rounded-r-xl">
        Tools
      </a>
      <a *ngIf="isLoggedIn" routerLink="/dashboard" (click)="isMenuOpen = false" routerLinkActive="bg-primary-50 text-primary-600 border-primary-600"
         class="block pl-3 pr-4 py-3 border-l-4 border-transparent text-base font-bold text-slate-600 hover:bg-slate-50 transition-all rounded-r-xl">
        Dashboard
      </a>

      <!-- Auth actions in mobile menu -->
      <ng-container *ngIf="(userReady$ | async) && isBrowser">
        <div *ngIf="!isLoggedIn" class="pt-6 mt-4 border-t border-slate-50 flex flex-col space-y-3">
          <a [routerLink]="['/login']" [queryParams]="{ signUp: false }" (click)="isMenuOpen = false"
             class="flex items-center justify-center w-full px-4 py-3 text-base font-bold text-slate-600 bg-slate-50 hover:bg-slate-100 rounded-2xl transition-all">
            Log in
          </a>
          <a [routerLink]="['/login']" [queryParams]="{ signUp: true }" (click)="isMenuOpen = false"
             class="flex items-center justify-center w-full px-4 py-3 text-base font-bold text-white bg-primary-600 hover:bg-primary-700 rounded-2xl shadow-lg shadow-primary-200 transition-all">
            Get Started
          </a>
        </div>

        <div *ngIf="isLoggedIn" class="pt-6 mt-4 border-t border-slate-50">
          <div class="flex items-center px-3 mb-4">
            <img class="h-10 w-10 rounded-xl border border-slate-200" [src]="userProfilePicUrl" alt="Profile">
            <div class="ml-3">
              <div class="text-sm font-black text-slate-800">My Account</div>
              <div class="text-xs font-bold text-slate-400">Logged in</div>
            </div>
          </div>
          <div class="space-y-1">
            <a (click)="logout()" class="flex items-center gap-2 px-3 py-3 text-base font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition-all cursor-pointer">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</nav>
