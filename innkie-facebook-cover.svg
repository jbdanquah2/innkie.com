<svg width="1640" height="624" viewBox="0 0 1640 624" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sophisticated Background Gradient -->
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1640" y2="624" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    
    <!-- Pattern Mask -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1640" height="624" fill="url(#bg_grad)"/>
  <rect width="1640" height="624" fill="url(#grid)"/>

  <!-- Decorative Abstract Blobs (Brand Colors) -->
  <circle cx="1400" cy="100" r="250" fill="#4F46E5" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="200" cy="500" r="200" fill="#EC4899" fill-opacity="0.05" filter="url(#glow)"/>

  <!-- Main Branding Content -->
  <g transform="translate(120, 240)">
    <!-- iNNkie Logo Text -->
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-weight="900" font-style="italic" font-size="110" fill="white" letter-spacing="-0.02em">iNNkie</text>
    
    <!-- Slogan -->
    <text x="0" y="70" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="32" fill="#94A3B8" letter-spacing="0.1em">PRIVACY-FIRST. LOCAL &amp; SECURE.</text>
    
    <!-- Feature List -->
    <g transform="translate(0, 140)">
       <text x="0" y="0" font-family="Inter, sans-serif" font-weight="600" font-size="20" fill="white" fill-opacity="0.8">
         <tspan fill="#6366F1">●</tspan> URL Shortener  
         <tspan dx="30" fill="#10B981">●</tspan> QR Studio  
         <tspan dx="30" fill="#3B82F6">●</tspan> Image Optimizer  
         <tspan dx="30" fill="#F59E0B">●</tspan> PDF Tools
       </text>
    </g>
  </g>

  <!-- Visual Elements: The "Utilities" Grid -->
  <g transform="translate(1000, 150)">
    <!-- Link Icon Card -->
    <rect x="0" y="0" width="140" height="140" rx="32" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <path d="M60 70C60 64.4772 64.4772 60 70 60H90C95.5228 60 100 64.4772 100 70V70C100 75.5228 95.5228 80 90 80H70C64.4772 80 60 75.5228 60 70V70Z" stroke="#6366F1" stroke-width="4"/>
    
    <!-- QR Icon Card -->
    <rect x="180" y="80" width="140" height="140" rx="32" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <rect x="220" y="120" width="60" height="60" rx="8" stroke="#10B981" stroke-width="4"/>
    <rect x="235" y="135" width="30" height="30" rx="4" fill="#10B981"/>

    <!-- Media Icon Card -->
    <rect x="90" y="220" width="140" height="140" rx="32" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <circle cx="160" cy="290" r="25" stroke="#3B82F6" stroke-width="4"/>
  </g>

  <!-- URL Suffix -->
  <text x="120" y="550" font-family="Inter, sans-serif" font-weight="900" font-size="24" fill="white" fill-opacity="0.3" letter-spacing="0.2em">WWW.INNKIE.COM</text>
</svg>
